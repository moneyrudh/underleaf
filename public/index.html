<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>underleaf</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="tb-left">
        <span class="brand">under<i>leaf</i></span>
        <span id="workspace-name" class="workspace-name"></span>
        <span id="connection" class="connection" hidden>Disconnected. Is <code>bun dev</code> running?</span>
      </div>
      <button id="quick-open" class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3 3" /></svg>
        <span>Go to file or command</span><kbd data-key="mod+p"></kbd>
      </button>
      <div class="tb-right">
        <button id="toggle-tree" class="ibtn on" data-tip="Show or hide files · focus them with" data-key="LEADER 1" aria-label="Show or hide files">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="12" height="11" rx="1.5" /><path d="M6 2.5v11" /></svg>
        </button>
        <button id="toggle-claude" class="ibtn on" data-tip="Show or hide Claude · focus it with" data-key="LEADER 2" aria-label="Show or hide Claude">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="12" height="11" rx="1.5" /><path d="M5 6.5 7 8 5 9.5M8.5 10h3" /></svg>
        </button>
        <button id="help" class="ibtn" data-tip="Keyboard shortcuts" data-key="?" aria-label="Keyboard shortcuts">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6" /><path d="M6.4 6.3a1.7 1.7 0 1 1 2.4 1.6c-.5.3-.8.6-.8 1.2M8 11.2v.1" /></svg>
        </button>
      </div>
    </header>

    <main id="workspace" class="workspace">
      <div id="tree-rail" class="tree-rail" hidden>
        <button id="expand-tree" class="ibtn" data-tip="Show files" data-key="LEADER 1" aria-label="Show files">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5" /></svg>
        </button>
      </div>
      <nav id="tree-pane" class="pane tree-pane" tabindex="0" aria-label="Files">
        <div class="pane-head">
          <span class="pane-title">Files</span>
          <span class="spacer"></span>
          <button id="collapse-tree" class="ibtn" data-tip="Hide files" aria-label="Hide files">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg>
          </button>
        </div>
        <div id="tree" class="tree" role="tree"></div>
        <div id="tree-foot" class="tree-foot" hidden>
          <span id="agent-count"></span>
          <button id="agent-toggle" class="link"></button>
        </div>
      </nav>
      <div class="splitter" data-pane="tree-pane" data-var="--tree-w"></div>

      <section id="claude-pane" class="pane claude-pane">
        <div class="pane-head">
          <span class="pane-title">Claude</span>
          <span class="hint">in <code>latex/</code></span>
        </div>
        <div id="terminal" class="terminal"></div>
      </section>
      <div class="splitter" data-pane="claude-pane" data-var="--claude-w"></div>

      <section id="preview-pane" class="pane preview-pane" tabindex="0">
        <div class="pane-head toolbar">
          <span id="preview-title" class="pane-title file">Preview</span>
          <span id="status" class="status"></span>
          <span class="spacer"></span>
          <div id="zoom" class="menu-wrap">
            <button id="zoom-menu-btn" class="select" aria-haspopup="menu" aria-controls="zoom-menu" data-tip="Zoom">
              <span id="zoom-label">Fit</span><span class="chev">▾</span>
            </button>
            <div id="zoom-menu" class="popover" role="menu" hidden>
              <button id="zoom-fit" role="menuitem" data-key="=">Fit width</button>
              <hr />
              <button role="menuitem" data-zoom="0.75">75%</button>
              <button role="menuitem" data-zoom="1">100%</button>
              <button role="menuitem" data-zoom="1.5">150%</button>
              <hr />
              <button id="zoom-in" role="menuitem" data-key="+">Zoom in</button>
              <button id="zoom-out" role="menuitem" data-key="-">Zoom out</button>
            </div>
          </div>
          <button id="toggle-history" class="ibtn" hidden data-tip="Version history" data-key="H" aria-label="Version history">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6" /><path d="M8 4.5V8l2.5 1.5" /></svg>
          </button>
          <button id="toggle-logs" class="ibtn" hidden data-tip="Logs" data-key="L" aria-label="Logs">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4h10M3 8h10M3 12h6" /></svg>
            <span class="badge" hidden></span>
          </button>
          <button id="export" class="primary" hidden data-key="mod+s">Save PDF</button>
          <div class="menu-wrap">
            <button id="more-btn" class="ibtn" aria-haspopup="menu" aria-controls="more-menu" data-tip="More" aria-label="More">
              <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.3" /><circle cx="8" cy="8" r="1.3" /><circle cx="12.5" cy="8" r="1.3" /></svg>
            </button>
            <div id="more-menu" class="popover" role="menu" hidden>
              <button role="menuitem" data-command="compare-previous" data-key="C">Compare with previous version</button>
              <button role="menuitem" data-command="compare-file">Compare with another file…</button>
              <hr />
              <a id="download" role="menuitem" hidden>Download</a>
              <button role="menuitem" data-command="copy-path">Copy path</button>
              <button role="menuitem" data-command="mention" data-key="a">Mention in Claude</button>
              <hr />
              <button id="hide-strip" role="menuitem" data-command="version-bar" data-key="V"><span class="label">Hide version bar</span></button>
            </div>
          </div>
        </div>
        <div id="compare-bar" class="compare-bar" hidden>
          <div class="compare-sides">
            <button id="compare-a" class="picker" aria-haspopup="listbox" aria-label="Before"></button>
            <span class="arrow">→</span>
            <button id="compare-b" class="picker" aria-haspopup="listbox" aria-label="After"></button>
            <span id="compare-names" class="compare-names" hidden></span>
          </div>
          <span id="compare-status" class="status"></span>
          <span class="spacer"></span>
          <div class="seg" role="group" aria-label="Compare">
            <button id="compare-reader" data-key="S">Reader</button>
            <button id="compare-source" data-key="S">Source</button>
          </div>
          <button id="compare-prev" class="ibtn" data-tip="Previous change" data-key="[ c" aria-label="Previous change">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 13V3M4 7l4-4 4 4" /></svg>
          </button>
          <button id="compare-next" class="ibtn" data-tip="Next change" data-key="] c" aria-label="Next change">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3v10M4 9l4 4 4-4" /></svg>
          </button>
          <button id="compare-close" class="primary" data-key="escape">Done</button>
        </div>
        <div id="version-strip" class="version-strip" hidden>
          <span class="strip-title">Versions</span>
          <div class="strip-scroll"><ol id="version-track" class="version-track"></ol></div>
          <div id="version-tip" class="version-tip" hidden></div>
        </div>
        <div id="preview-body" class="preview-body">
          <div class="viewer-col">
            <div id="snapshot-banner" class="snapshot-banner" hidden>
              <span class="snapshot-what"></span>
              <span class="spacer"></span>
              <button id="snapshot-compare" class="ghost" data-key="C">Compare with current</button>
              <button id="snapshot-restore" class="ghost">Restore this version</button>
              <button id="snapshot-back" class="primary" data-key="escape">Back to current</button>
            </div>
            <div id="viewer" class="viewer"></div>
            <div id="diff" class="diff" hidden></div>
          </div>
          <aside id="logs" class="side-panel logs" hidden><div class="side-head">Logs</div><ul id="diagnostics"></ul></aside>
          <aside id="history" class="side-panel history" hidden>
            <div class="side-head">Version history</div>
            <ul id="history-list"></ul>
          </aside>
        </div>
      </section>
    </main>

    <div id="palette" class="overlay" hidden>
      <div class="palette" role="dialog" aria-label="Quick open">
        <input id="palette-input" autocomplete="off" spellcheck="false" />
        <ul id="palette-list"></ul>
      </div>
    </div>

    <div id="cheatsheet" class="overlay" tabindex="-1" hidden>
      <div class="sheet" role="dialog" aria-label="Keyboard shortcuts">
        <div class="sheet-head"><span>Keyboard shortcuts</span><kbd>Esc</kbd></div>
        <div id="cheatsheet-body" class="sheet-body"></div>
      </div>
    </div>

    <div id="leader" class="leader" hidden>
      <kbd>h</kbd><kbd>l</kbd> move · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> pane · <kbd>z</kbd> zoom pane
    </div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
