<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>underleaf</title>
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar">
      <span class="brand">under<b>leaf</b></span>
      <span id="connection" class="connection" hidden>disconnected — is <code>bun dev</code> running?</span>
      <span class="spacer"></span>
      <button id="quick-open" class="search" title="Go to file">
        <span>Go to file…</span><kbd data-key="mod+p"></kbd>
      </button>
      <span class="spacer"></span>
      <button id="toggle-tree" class="toggle on" data-tip="Show or hide files · focus them with" data-key="LEADER 1">Files</button>
      <button id="toggle-claude" class="toggle on" data-tip="Show or hide Claude · focus it with" data-key="LEADER 2">Claude</button>
      <button id="help" class="toggle icon" aria-label="Keyboard shortcuts" data-tip="Keyboard shortcuts" data-key="?">?</button>
    </header>

    <main id="workspace" class="workspace">
      <div id="tree-rail" class="tree-rail" hidden>
        <button id="expand-tree" class="rail-button" aria-label="Show files" data-tip="Show files" data-key="LEADER 1"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
      </div>
      <nav id="tree-pane" class="pane tree-pane" tabindex="0" aria-label="Files">
        <div class="pane-head">
          <span class="pane-title">Files</span>
          <span class="spacer"></span>
          <button id="collapse-tree" class="rail-button" aria-label="Hide files" data-tip="Hide files"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button>
        </div>
        <div id="tree" class="tree" role="tree"></div>
      </nav>
      <div class="splitter" data-pane="tree-pane" data-var="--tree-w"></div>

      <section id="claude-pane" class="pane claude-pane">
        <div class="pane-head">
          <span class="pane-title">Claude Code</span>
          <span class="hint">working in <code>latex/</code></span>
        </div>
        <div id="terminal" class="terminal"></div>
      </section>
      <div class="splitter" data-pane="claude-pane" data-var="--claude-w"></div>

      <section id="preview-pane" class="pane preview-pane" tabindex="0">
        <div class="pane-head">
          <span id="preview-title" class="pane-title">Preview</span>
          <span id="status" class="status"></span>
          <span class="spacer"></span>
          <div id="zoom" class="zoom" role="group" aria-label="Zoom">
            <button id="zoom-out" data-tip="Zoom out" data-key="-">−</button>
            <button id="zoom-fit" data-tip="Fit to width" data-key="=">Fit</button>
            <button id="zoom-in" data-tip="Zoom in" data-key="+">+</button>
          </div>
          <button id="show-strip" class="ghost" hidden data-key="V">Versions</button>
          <button id="toggle-history" class="ghost" hidden data-key="H">History</button>
          <button id="toggle-logs" class="ghost" hidden data-key="L"><span class="label">Logs</span></button>
          <button id="export" class="primary" hidden data-key="mod+s">Save PDF</button>
          <a id="download" class="ghost icon" hidden data-tip="Download PDF" aria-label="Download PDF">⤓</a>
        </div>
        <div id="version-strip" class="version-strip" hidden>
          <span class="strip-title">Versions</span>
          <div class="strip-scroll"><ol id="version-track" class="version-track"></ol></div>
          <button id="hide-strip" class="rail-button" aria-label="Hide version bar" data-tip="Hide version bar" data-key="V">
            <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
          </button>
          <div id="version-tip" class="version-tip" hidden></div>
        </div>
        <div id="preview-body" class="preview-body">
          <div class="viewer-col">
            <div id="snapshot-banner" class="snapshot-banner" hidden>
              <span class="snapshot-what"></span>
              <span class="spacer"></span>
              <button id="snapshot-compare" class="ghost" data-key="C">Compare with current</button>
              <button id="snapshot-restore" class="ghost">Restore this version</button>
              <button id="snapshot-back" class="primary" data-key="escape">Back to current</button>
            </div>
            <div id="compare-bar" class="compare-bar" hidden>
              <div class="compare-sides">
                <button id="compare-a" class="picker" aria-haspopup="listbox" aria-label="Before"></button>
                <span class="arrow">→</span>
                <button id="compare-b" class="picker" aria-haspopup="listbox" aria-label="After"></button>
                <span id="compare-names" class="compare-names" hidden></span>
              </div>
              <span class="spacer"></span>
              <div class="seg" role="group" aria-label="Compare">
                <button id="compare-reader" data-key="S">Reader</button>
                <button id="compare-source" data-key="S">Source</button>
              </div>
              <button id="compare-prev" class="ghost icon" aria-label="Previous change" data-tip="Previous change" data-key="[ c">↑</button>
              <button id="compare-next" class="ghost icon" aria-label="Next change" data-tip="Next change" data-key="] c">↓</button>
              <button id="compare-close" class="primary" data-key="escape">Done</button>
            </div>
            <div id="viewer" class="viewer"></div>
            <div id="diff" class="diff" hidden></div>
          </div>
          <aside id="logs" class="logs" hidden><ul id="diagnostics"></ul></aside>
          <aside id="history" class="history" hidden>
            <div class="history-head">Version history</div>
            <ul id="history-list"></ul>
          </aside>
        </div>
      </section>
    </main>

    <div id="palette" class="overlay" hidden>
      <div class="palette" role="dialog" aria-label="Quick open">
        <input id="palette-input" autocomplete="off" spellcheck="false" />
        <ul id="palette-list"></ul>
      </div>
    </div>

    <div id="cheatsheet" class="overlay" tabindex="-1" hidden>
      <div class="sheet" role="dialog" aria-label="Keyboard shortcuts">
        <div class="sheet-head"><span>Keyboard shortcuts</span><kbd>Esc</kbd></div>
        <div id="cheatsheet-body" class="sheet-body"></div>
      </div>
    </div>

    <div id="leader" class="leader" hidden>
      <kbd>h</kbd><kbd>l</kbd> move · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> pane · <kbd>z</kbd> zoom pane
    </div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
